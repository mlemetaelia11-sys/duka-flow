<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Owner Account | DukaFlow</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="/assets/dukaflow-icon.png" type="image/png">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <a class="brand auth-brand" href="/">DukaFlow</a>
        <section class="auth-card" aria-labelledby="register-title">
            <p class="section-label">Initial setup</p>
            <h1 id="register-title">Create owner account</h1>
            <p class="section-description">Set up the primary DukaFlow account.</p>

            <button id="google-register" class="google-auth-button" type="button">
                <svg class="google-auth-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M21.35 12.23c0-.74-.07-1.45-.21-2.13H12v4.03h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.29Z"/>
                    <path fill="#34A853" d="M12 21.5c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.29v2.53A9.74 9.74 0 0 0 12 21.5Z"/>
                    <path fill="#FBBC05" d="M6.53 13.59a5.86 5.86 0 0 1 0-3.18V7.88H3.29a9.5 9.5 0 0 0 0 8.24l3.24-2.53Z"/>
                    <path fill="#EA4335" d="M12 6.38c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.35 14.63 2.5 12 2.5a9.74 9.74 0 0 0-8.71 5.38l3.24 2.53C7.3 8.1 9.46 6.38 12 6.38Z"/>
                </svg>
                <span>Sign up with Google</span>
            </button>

            <div class="auth-divider" aria-hidden="true"><span>or</span></div>

            <form id="register-form" novalidate>
                <label class="form-field">
                    <span>Business Name</span>
                    <input id="register-business-name" name="businessName" autocomplete="organization" required minlength="2" maxlength="150">
                </label>
                <label class="form-field">
                    <span>Name</span>
                    <input id="register-name" name="name" autocomplete="name" required>
                </label>
                <label class="form-field">
                    <span>Email</span>
                    <input id="register-email" name="email" type="email" autocomplete="email" required>
                </label>
                <label class="form-field auth-password-field">
                    <span>Password</span>
                    <span class="auth-password-control">
                        <input id="register-password" name="password" type="password" autocomplete="new-password" required minlength="10">
                        <button type="button" class="secondary-button" data-toggle-password="register-password" aria-label="Show password">Show</button>
                    </span>
                </label>
                <div class="password-strength" aria-live="polite">
                    <span>Password strength</span>
                    <progress id="register-password-strength" max="4" value="0"></progress>
                    <strong id="register-password-strength-label">Enter a password</strong>
                </div>
                <p id="register-message" class="form-message" role="alert" aria-live="polite"></p>
                <button id="register-submit" class="primary-button auth-submit" type="submit">Create account</button>
            </form>
            <p class="auth-footnote">Already have an account? <a href="/login/">Sign in</a></p>
        </section>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/register.js"></script>
    <script src="/js/offline-sync.js"></script>
<script src="/js/i18n.js"></script></body>
</html>
