<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071B35"><title>Matumizi | DukaFlow</title><link rel="manifest" href="../manifest.json"><link rel="stylesheet" href="../css/style.css"><link rel="icon" href="/assets/dukaflow-icon.png" type="image/png"></head>
<body><div class="app-layout"><aside class="sidebar"><div class="sidebar-brand"><h2>DukaFlow</h2></div><nav class="sidebar-nav"></nav></aside><main class="main-content"><header class="page-header"><div><p class="section-label">FEDHA</p><h1>Matumizi</h1><p>Fuatilia gharama za biashara na athari zake kwenye faida.</p></div><button class="primary-button" id="new-expense">+ Ongeza matumizi</button></header>
<section class="stats-grid df-kpi-grid"><article class="stat-card df-kpi-card"><div class="df-kpi-top"><span class="df-kpi-icon expense">−</span><span class="df-kpi-label">Matumizi · Siku 30</span></div><h2 id="total" class="stat-value">TSh 0</h2><p class="stat-note" id="expense-count">0 rekodi</p></article></section>
<section class="card df-expense-form-card" id="expense-form-card"><div class="card-header"><p class="section-label">REKODI</p><h2 id="form-title">Ongeza Matumizi</h2><p class="df-card-subtitle">Hifadhi gharama kwa usahihi ili ripoti za faida ziwe sahihi.</p></div><form id="form" class="form-grid"><label class="form-field"><span>Kategoria</span><input id="category" required maxlength="100" placeholder="Mfano: Kodi"></label><label class="form-field"><span>Maelezo</span><input id="description" required maxlength="255" placeholder="Mfano: Kodi ya mwezi"></label><label class="form-field"><span>Kiasi</span><input id="amount" type="number" min="0.01" step="0.01" required placeholder="0"></label><label class="form-field"><span>Njia ya malipo</span><select id="method"><option value="cash">Taslimu</option><option value="mobile_money">Mobile Money</option><option value="bank">Benki</option><option value="other">Nyingine</option></select></label><label class="form-field"><span>Tarehe</span><input id="expense-date" type="date"></label><label class="form-field"><span>Rejea (hiari)</span><input id="reference" maxlength="120" placeholder="Reference"></label><div class="compact-grid"><button class="secondary-button" id="cancel-edit" type="button" hidden>Ghairi</button><button class="primary-button" id="submit-expense" type="submit">Hifadhi matumizi</button></div><p id="msg" class="form-message"></p></form></section>
<section class="card"><div class="card-header df-card-header-row"><div><p class="section-label">HISTORIA</p><h2>Matumizi ya Siku 30</h2></div><button class="secondary-button" id="refresh-expenses" type="button">Refresh</button></div><div class="table-wrapper"><table class="data-table df-modern-table"><thead><tr><th>Tarehe</th><th>Kategoria</th><th>Maelezo</th><th>Kiasi</th><th>Njia</th><th>Staff</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="7"><div class="df-table-loading">Inapakia...</div></td></tr></tbody></table></div></section></main></div><script src="/js/auth.js"></script><script src="/js/expenses.js"></script><script src="/js/i18n.js"></script></body></html>
