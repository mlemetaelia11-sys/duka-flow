<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Email | DukaFlow</title><link rel="stylesheet" href="../css/style.css"></head><body class="auth-page"><main class="auth-shell"><section class="auth-card"><h1>Verify your email</h1><p id="message">Checking verification link…</p><a class="primary-button" href="/login/">Continue to sign in</a></section></main><script>(async()=>{const t=new URLSearchParams(location.search).get('token');const r=await fetch('/api/auth/verify-email?token='+encodeURIComponent(t||''));const d=await r.json();document.querySelector('#message').textContent=d.message||'Done.'})()</script><script src="/js/auth.js"></script><script src="/js/i18n.js"></script></body></html>
