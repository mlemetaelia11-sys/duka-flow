<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers | DukaFlow</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-content">

            <a class="brand" href="/">DukaFlow</a>

            <nav class="main-nav" aria-label="Main navigation">
                <a href="/">Dashboard</a>
                <a href="/products/">Products</a>
                <a href="/sales/">Sales</a>
                <a href="/customers/">Customers</a>
                <a href="/debts/">Debts</a>
            </nav>

        </div>
    </header>

    <main class="container page-content">

        <section class="page-heading">
            <div>
                <p class="section-label">Customers</p>
                <h1>Customers</h1>
                <p class="section-description">
                    Manage customers and view their purchase and debt information.
                </p>
            </div>

            <button
    id="open-customer-modal"
    class="primary-button"
    type="button"
>
    Add Customer
</button>
        </section>

        <section class="customers-card">

            <div class="customers-toolbar">

                <label class="search-field">
                    <span>Search customers</span>
                    <input
    id="customer-search"
    type="search"
    placeholder="Search by name or phone..."
    aria-label="Search customers"
>
                </label>

            </div>

            <div class="table-wrapper">

                <table class="customers-table">

                    <thead>
                        <tr>
                            <th scope="col">Customer</th>
                            <th scope="col">Phone</th>
                            <th scope="col">Total Purchases</th>
                            <th scope="col">Outstanding Debt</th>
                            <th scope="col">Status</th>
                            <th scope="col">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="customers-table-body"></tbody>

                        <tr>
                            <td colspan="6">

                                <div class="table-empty-state">
                                    <strong>No customers yet</strong>

                                    <span>
                                        Customers will appear here after they are added.
                                    </span>
                                </div>

                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <div
    id="customer-modal"
    class="modal"
    aria-hidden="true"
>
    <div
        class="modal-overlay"
        data-close-customer-modal
    ></div>

    <section
        class="modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="customer-modal-title"
    >
        <div class="modal-header">
            <div>
                <p class="section-label">Customers</p>
                <h2 id="customer-modal-title">Add Customer</h2>
            </div>

            <button
                class="modal-close"
                type="button"
                data-close-customer-modal
                aria-label="Close dialog"
            >
                ×
            </button>
        </div>

        <form id="customer-form">

            <label class="form-field">
                <span>Customer Name</span>

                <input
                    type="text"
                    id="customer-name"
                    name="customer-name"
                    required
                >
            </label>

            <label class="form-field">
                <span>Phone Number</span>

                <input
                    type="tel"
                    id="customer-phone"
                    name="customer-phone"
                    placeholder="e.g. 0712345678"
                    required
                >
            </label>

            <div
                id="customer-form-message"
                class="form-message"
                role="alert"
                aria-live="polite"
            ></div>

            <div class="modal-actions">

                <button
                    class="secondary-button"
                    type="button"
                    data-close-customer-modal
                >
                    Cancel
                </button>

                <button
                    class="primary-button"
                    type="submit"
                >
                    Add Customer
                </button>

            </div>

        </form>
    </section>
</div>

<script src="../js/customers.js"></script>

<button
    id="open-customer-modal"
    class="primary-button"
    type="button"
>
    Add Customer
</button>

</body>
</html>
