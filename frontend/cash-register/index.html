<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Cash Register | DukaFlow</title><link rel="manifest" href="../manifest.json"><link rel="stylesheet" href="../css/style.css">    <link rel="icon" href="/assets/dukaflow-icon.png" type="image/png">
</head><body><div class="app-layout"><aside class="sidebar"><div class="sidebar-brand"><h2>DukaFlow</h2><span>Retail Management</span></div><nav class="sidebar-nav"></nav></aside><main class="main-content"><header class="page-header"><div><p class="section-label">Till</p><h1>Cash Register</h1><p>Open a till, track cash movements, and reconcile closing cash.</p></div></header><section id="register-status" class="card"></section><section class="dashboard-grid"><article class="card"><h2>Open Register</h2><form id="open-form"><label class="form-field"><span>Opening Cash</span><input id="opening-balance" type="number" min="0" step="0.01" value="0" required></label><label class="form-field"><span>Notes</span><input id="opening-notes" maxlength="255"></label><button class="primary-button" type="submit">Open Register</button><p id="open-message" class="form-message"></p></form></article><article class="card"><h2>Cash Movement</h2><form id="movement-form"><label class="form-field"><span>Type</span><select id="movement-type"><option value="cash_in">Cash In</option><option value="cash_out">Cash Out</option><option value="adjustment">Adjustment</option></select></label><label class="form-field"><span>Direction</span><select id="movement-direction"><option value="in">Cash In</option><option value="out">Cash Out</option></select></label><label class="form-field"><span>Amount</span><input id="movement-amount" type="number" min="0.01" step="0.01" required></label><label class="form-field"><span>Note</span><input id="movement-note" maxlength="255"></label><button class="primary-button" type="submit">Record Movement</button><p id="movement-message" class="form-message"></p></form></article><article class="card"><h2>Close Register</h2><form id="close-form"><label class="form-field"><span>Counted Cash</span><input id="closing-balance" type="number" min="0" step="0.01" required></label><label class="form-field"><span>Notes</span><input id="closing-notes" maxlength="255"></label><button class="primary-button" type="submit">Close Register</button><p id="close-message" class="form-message"></p></form></article></section><section class="card"><div class="card-header"><h2>Cash Movement History</h2></div><div class="table-wrapper"><table class="data-table"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Note</th><th>User</th></tr></thead><tbody id="cash-history"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></section></main></div><script src="../js/auth.js"></script><script src="../js/cash-register.js"></script>    <script src="/js/offline-sync.js"></script>
<script src="/js/i18n.js"></script></body></html>
