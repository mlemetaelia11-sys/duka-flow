<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset | DukaFlow</title><link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="/assets/dukaflow-icon.png" type="image/png">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-card">
        <div class="auth-brand"><span>DukaFlow</span><small>Account Recovery</small></div>
        <h1>Reset your password</h1>
        <p class="section-description">Request a reset token, then set a new password. Email delivery can be connected when SMTP/provider credentials are configured.</p>
        <form id="forgot-form">
            <label class="form-field"><span>Email</span><input id="reset-email" type="email" required autocomplete="email"></label>
            <p id="forgot-message" class="form-message"></p>
            <div id="dev-token" class="dev-reset-box" hidden></div>
            <button id="forgot-button" class="primary-button auth-submit" type="submit">Request Reset</button>
        </form>
        <hr>
        <form id="reset-form">
            <label class="form-field"><span>Reset Token</span><input id="reset-token" required></label>
            <label class="form-field"><span>New Password</span><input id="reset-password" type="password" minlength="10" required autocomplete="new-password"></label>
            <label class="form-field"><span>Confirm Password</span><input id="reset-confirm" type="password" minlength="10" required autocomplete="new-password"></label>
            <p id="reset-message" class="form-message"></p>
            <button class="secondary-button auth-submit" type="submit">Reset Password</button>
        </form>
        <p class="auth-footnote"><a href="/login/">Back to login</a></p>
    </section>
</main>
<script src="../js/auth.js"></script>
<script src="../js/password-reset.js"></script>
    <script src="/js/offline-sync.js"></script>
<script src="/js/i18n.js"></script></body>
</html>
