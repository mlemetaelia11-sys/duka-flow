<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Approvals | DukaFlow</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="/assets/dukaflow-icon.png" type="image/png">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar"><div class="sidebar-brand"><h2>DukaFlow</h2><span>Retail Management</span></div><nav class="sidebar-nav"></nav></aside>
    <main class="main-content">
        <header class="page-header">
            <div><p class="section-label">Control</p><h1>Approval Center</h1><p>Track operational requests that need review.</p></div>
            <button class="secondary-button" id="refresh-approvals" type="button">Refresh</button>
        </header>

        <section class="dashboard-grid">
            <article class="card">
                <div class="card-header"><div><p class="section-label">Request</p><h2>Create Approval Request</h2></div></div>
                <form id="approval-form">
                    <div class="form-grid">
                        <label class="form-field"><span>Action</span><input id="approval-action" maxlength="50" placeholder="Cash adjustment, discount override..." required></label>
                        <label class="form-field"><span>Entity</span><input id="approval-entity" maxlength="50" placeholder="cash_register, sale, purchase..." required></label>
                        <label class="form-field"><span>Entity ID</span><input id="approval-entity-id" type="number" min="1"></label>
                        <label class="form-field"><span>Amount</span><input id="approval-amount" type="number" min="0" step="0.01"></label>
                    </div>
                    <label class="form-field"><span>Notes</span><textarea id="approval-notes" rows="3" maxlength="500"></textarea></label>
                    <button class="primary-button" id="approval-submit" type="submit">Submit Request</button>
                    <p id="approval-message" class="form-message"></p>
                </form>
            </article>

            <article class="card">
                <div class="card-header"><div><p class="section-label">Requests</p><h2>Approval Queue</h2></div></div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead><tr><th>Action</th><th>Entity</th><th>Amount</th><th>Requested By</th><th>Status</th><th>Date</th><th>Action</th></tr></thead>
                        <tbody id="approvals-body"><tr><td colspan="7">Loading...</td></tr></tbody>
                    </table>
                </div>
            </article>
        </section>
    </main>
</div>
<script src="../js/auth.js"></script>
<script src="../js/approvals.js"></script>
    <script src="/js/offline-sync.js"></script>
<script src="/js/i18n.js"></script></body>
</html>
