<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0f172a"><title>Returns | DukaFlow</title><link rel="manifest" href="../manifest.json"><link rel="stylesheet" href="../css/style.css">    <link rel="icon" href="/assets/dukaflow-icon.png" type="image/png">
</head><body><div class="app-layout"><aside class="sidebar"><div class="sidebar-brand"><h2>DukaFlow</h2><span>Retail Management</span></div><nav class="sidebar-nav"></nav></aside><main class="main-content"><header class="page-header"><div><p class="section-label">After-sales</p><h1>Returns & Refunds</h1><p>Return sold items and restore stock safely.</p></div></header><section class="dashboard-grid"><article class="card"><div class="card-header"><div><p class="section-label">New Return</p><h2>Select Sale</h2></div></div><label class="form-field"><span>Sale / Receipt</span><select id="return-sale" required><option value="">Select sale</option></select></label><div id="return-items" class="table-wrapper"><table class="data-table"><thead><tr><th>Product</th><th>Sold</th><th>Return Qty</th><th>Amount</th></tr></thead><tbody><tr><td colspan="4">Select a sale.</td></tr></tbody></table></div><label class="form-field"><span>Refund Method</span><select id="return-method"><option value="cash">Cash</option><option value="mobile_money">Mobile Money</option><option value="bank">Bank</option><option value="credit_balance">Reduce Credit Balance</option></select></label><label class="form-field"><span>Reference</span><input id="return-reference" maxlength="100"></label><label class="form-field"><span>Reason</span><input id="return-reason" maxlength="255"></label><button class="primary-button" id="return-submit" type="button">Complete Return</button><p id="return-message" class="form-message" role="alert"></p></article><article class="card"><div class="card-header"><div><p class="section-label">History</p><h2>Recent Returns</h2></div></div><div class="table-wrapper"><table class="data-table"><thead><tr><th>Return</th><th>Receipt</th><th>Customer</th><th>Total</th><th>Method</th><th>Date</th></tr></thead><tbody id="returns-body"><tr><td colspan="6">Loading...</td></tr></tbody></table></div></article></section></main></div><script src="../js/auth.js"></script><script src="../js/returns.js"></script>    <script src="/js/offline-sync.js"></script>
<script src="/js/i18n.js"></script></body></html>
